<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="히라가나 마스터">
<title>히라가나 마스터</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17181c;--muted:#737780;--line:#e4e6ec;--good:#22a35a;--bad:#df4c4c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;touch-action:manipulation}
button{font:inherit;cursor:pointer}
.app{max-width:1050px;margin:auto;min-height:100vh;padding:22px 24px 36px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
.logo{font-size:clamp(24px,4vw,34px);font-weight:900}.sub{color:var(--muted);font-size:14px;margin-top:4px}
.score{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 16px;display:flex;gap:18px;font-weight:800}
.screen{display:none}.screen.active{display:block}
.card{background:var(--card);border-radius:28px;padding:24px;box-shadow:0 8px 30px #0000000b;border:1px solid #eee}
.homegrid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.hero{padding:clamp(24px,5vw,52px);display:flex;flex-direction:column;justify-content:center;min-height:470px}
.hero h2{font-size:clamp(32px,6vw,54px);margin:0 0 12px}.hero p{color:var(--muted);line-height:1.7}
.category{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.cat{border:2px solid var(--line);background:#fff;border-radius:18px;padding:18px;text-align:left;font-weight:800;min-height:86px}.cat small{display:block;color:var(--muted);font-weight:500;margin-top:6px}.cat.selected{border-color:var(--ink);background:#f1f2f5}
.primary{width:100%;border:0;border-radius:16px;padding:17px;background:var(--ink);color:#fff;font-weight:900;font-size:17px}
.secondary{border:0;border-radius:14px;padding:13px 16px;background:#eceef3;font-weight:800}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.mode button{border:0;border-radius:13px;padding:13px;background:#eceef3;font-weight:800}.mode .selected{background:var(--ink);color:#fff}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.quit{border:0;background:transparent;font-weight:800;color:var(--muted)}
.progress{height:9px;background:#e7e8ed;border-radius:99px;overflow:hidden;margin:12px 0 22px}.fill{height:100%;width:0;background:var(--ink);transition:.25s}
.question{text-align:center;padding:10px}.tag{display:inline-block;padding:7px 11px;border-radius:99px;background:#eef0f5;color:#555;font-size:13px;font-weight:800}.big{font-size:clamp(76px,14vw,130px);font-weight:900;margin:18px 0 5px}.ask{color:var(--muted);font-size:16px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.answer{border:2px solid var(--line);background:#fff;border-radius:18px;padding:18px;min-height:74px;font-size:clamp(20px,3vw,28px);font-weight:900}.answer.good{background:#eaf8ef;border-color:var(--good)}.answer.bad{background:#fff0f0;border-color:var(--bad)}
.feedback{text-align:center;min-height:30px;margin:15px 0;font-weight:900}.next{width:100%;border:0;border-radius:16px;padding:16px;background:var(--ink);color:#fff;font-weight:900;font-size:17px;display:none}
.result{text-align:center;padding:35px}.result .percent{font-size:70px;font-weight:900;margin:15px}.result p{color:var(--muted)}
.reviewbox{margin-top:16px}.reviewbox h3{margin-top:0}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:8px 10px;background:#f0f1f5;border-radius:10px;font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#f5f6f9;border-radius:16px;padding:15px}.stat b{font-size:24px;display:block;margin-top:4px}.small{color:var(--muted);font-size:13px}
.install{margin-top:16px;padding:14px;border-radius:16px;background:#f0f2f7;line-height:1.6;font-size:13px;color:#555}
@media(max-width:720px){.app{padding:14px}.homegrid{grid-template-columns:1fr}.hero{min-height:auto}.score{font-size:12px;gap:8px;padding:8px}.logo{font-size:23px}}
@media(orientation:landscape) and (min-width:700px){.questionarea{display:grid;grid-template-columns:.8fr 1.2fr;align-items:center;gap:25px}.big{margin:5px 0}}
</style>
</head>
<body>
<div class="app">
<header>
<div><div class="logo">🇯🇵 히라가나 마스터</div><div class="sub">청음 · 탁음 · 반탁음 · 요음 완전 암기</div></div>
<div class="score">🔥 <span id="combo">0</span>　🎯 <span id="accuracy">0%</span></div>
</header>

<section id="home" class="screen active">
<div class="homegrid">
<div class="card hero">
<h2>일본어, 게임처럼 외우자.</h2>
<p>문제를 풀고 틀린 글자를 자동으로 모아서 다시 연습해요.<br>아이패드 터치에 맞춰 크게 만들었습니다.</p>
<div class="category">
<button class="cat selected" data-cat="청음">청음 <small>あ・か・さ・た…</small></button>
<button class="cat" data-cat="탁음">탁음 <small>が・ざ・だ・ば…</small></button>
<button class="cat" data-cat="반탁음">반탁음 <small>ぱ・ぴ・ぷ・ぺ・ぽ</small></button>
<button class="cat" data-cat="요음">요음 <small>きゃ・しゃ・ちゃ…</small></button>
</div>
<div class="mode"><button class="selected" data-mode="0">일본어 → 발음</button><button data-mode="1">발음 → 일본어</button></div>
<button id="start" class="primary">▶ 학습 시작</button>
</div>
<div class="card">
<h3>📚 학습 기록</h3>
<div class="statgrid">
<div class="stat">정답<b id="homeCorrect">0</b></div><div class="stat">오답<b id="homeWrong">0</b></div><div class="stat">콤보<b id="homeCombo">0</b></div>
</div>
<div class="reviewbox"><h3>📌 오답 노트</h3><div id="homeMistakes" class="chips"><span class="small">아직 틀린 문제가 없어요.</span></div></div>
<button id="review" class="secondary" style="width:100%;margin-top:18px">오답만 다시 풀기</button>
<div class="install">💡 Safari에서 홈 화면에 추가하면 아이패드에서 아이콘을 눌러 앱처럼 사용할 수 있어요.</div>
</div>
</div>
</section>

<section id="quiz" class="screen">
<div class="card">
<div class="topbar"><b id="counter">1 / 10</b><button id="quit" class="quit">학습 종료</button></div>
<div class="progress"><div id="fill" class="fill"></div></div>
<div class="questionarea">
<div class="question"><span id="tag" class="tag">청음</span><div id="big" class="big">あ</div><div id="ask" class="ask">이 글자의 발음은?</div></div>
<div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="next" class="next">다음 문제 →</button></div>
</div>
</div>
</section>

<section id="result" class="screen">
<div class="card result">
<div>🏆 학습 완료!</div><div id="resultPercent" class="percent">0%</div><p id="resultText"></p>
<div class="statgrid"><div class="stat">정답<b id="rCorrect">0</b></div><div class="stat">오답<b id="rWrong">0</b></div><div class="stat">최고 콤보<b id="rCombo">0</b></div></div>
<button id="again" class="primary">다시 도전</button>
<button id="back" class="secondary" style="width:100%;margin-top:9px">처음으로</button>
</div>
</section>
</div>

<script>
const DATA={
"청음":[["あ","a"],["い","i"],["う","u"],["え","e"],["お","o"],["か","ka"],["き","ki"],["く","ku"],["け","ke"],["こ","ko"],["さ","sa"],["し","shi"],["す","su"],["せ","se"],["そ","so"],["た","ta"],["ち","chi"],["つ","tsu"],["て","te"],["と","to"],["な","na"],["に","ni"],["ぬ","nu"],["ね","ne"],["の","no"],["は","ha"],["ひ","hi"],["ふ","fu"],["へ","he"],["ほ","ho"],["ま","ma"],["み","mi"],["む","mu"],["め","me"],["も","mo"],["や","ya"],["ゆ","yu"],["よ","yo"],["ら","ra"],["り","ri"],["る","ru"],["れ","re"],["ろ","ro"],["わ","wa"],["を","wo"],["ん","n"]],
"탁음":[["が","ga"],["ぎ","gi"],["ぐ","gu"],["げ","ge"],["ご","go"],["ざ","za"],["じ","ji"],["ず","zu"],["ぜ","ze"],["ぞ","zo"],["だ","da"],["ぢ","ji"],["づ","zu"],["で","de"],["ど","do"],["ば","ba"],["び","bi"],["ぶ","bu"],["べ","be"],["ぼ","bo"]],
"반탁음":[["ぱ","pa"],["ぴ","pi"],["ぷ","pu"],["ぺ","pe"],["ぽ","po"]],
"요음":[["きゃ","kya"],["きゅ","kyu"],["きょ","kyo"],["しゃ","sha"],["しゅ","shu"],["しょ","sho"],["ちゃ","cha"],["ちゅ","chu"],["ちょ","cho"],["にゃ","nya"],["にゅ","nyu"],["にょ","nyo"],["ひゃ","hya"],["ひゅ","hyu"],["ひょ","hyo"],["みゃ","mya"],["みゅ","myu"],["みょ","myo"],["りゃ","rya"],["りゅ","ryu"],["りょ","ryo"],["ぎゃ","gya"],["ぎゅ","gyu"],["ぎょ","gyo"],["じゃ","ja"],["じゅ","ju"],["じょ","jo"],["びゃ","bya"],["びゅ","byu"],["びょ","byo"],["ぴゃ","pya"],["ぴゅ","pyu"],["ぴょ","pyo"]]
};
let cat="청음",mode=0,q=null,choices=[],n=0,right=0,wrong=0,combo=0,bestCombo=0,answered=false,review=false;
let bad=JSON.parse(localStorage.getItem("hiraganaBad")||"{}");
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function all(){return Object.values(DATA).flat()}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function updateHeader(){$("combo").textContent=combo;$("accuracy").textContent=(right+wrong)?Math.round(right/(right+wrong)*100)+"%":"0%";$("homeCorrect").textContent=right;$("homeWrong").textContent=wrong;$("homeCombo").textContent=bestCombo}
function renderBad(){
 let e=Object.entries(bad).filter(x=>x[1]);
 $("homeMistakes").innerHTML=e.length?e.sort((a,b)=>b[1]-a[1]).map(x=>`<span class="chip">${x[0]} ×${x[1]}</span>`).join(""):'<span class="small">아직 틀린 문제가 없어요.</span>';
}
function start(isReview=false){
 review=isReview;
 let pool=review?Object.keys(bad).map(k=>find(k)).filter(Boolean):DATA[cat];
 if(!pool.length){alert("오답 노트가 비어 있어요!");return}
 window.pool=shuffle(pool);n=0;right=0;wrong=0;combo=0;bestCombo=0;show("quiz");question();
}
function find(k){for(const a of all())if(a[0]===k)return a}
function question(){
 q=window.pool[n%window.pool.length];answered=false;
 let candidates=shuffle([q,...shuffle(window.pool.filter(x=>x[0]!==q[0])).slice(0,3)]);
 choices=candidates;
 $("counter").textContent=`${(n%10)+1} / 10`;
 $("fill").style.width=`${(n%10+1)*10}%`;
 $("tag").textContent=review?"오답 복습":cat;
 $("big").textContent=mode===0?q[0]:q[1];
 $("ask").textContent=mode===0?"이 글자의 발음은?":"이 발음을 히라가나로 쓰면?";
 $("answers").innerHTML="";
 choices.forEach(x=>{let b=document.createElement("button");b.className="answer";b.textContent=mode===0?x[1]:x[0];b.onclick=()=>answer(b,x);$("answers").appendChild(b)});
 $("feedback").textContent="";$("next").style.display="none";
}
function answer(btn,x){
 if(answered)return;answered=true;
 document.querySelectorAll(".answer").forEach(b=>b.disabled=true);
 if(x[0]===q[0]){right++;combo++;bestCombo=Math.max(bestCombo,combo);btn.classList.add("good");$("feedback").textContent="⭕ 정답!";}
 else{wrong++;combo=0;bad[q[0]]=(bad[q[0]]||0)+1;localStorage.setItem("hiraganaBad",JSON.stringify(bad));btn.classList.add("bad");$("feedback").textContent=`❌ 오답! 정답은 ${q[1]}`;[...$("answers").children].find(b=>b.textContent===(mode===0?q[1]:q[0])).classList.add("good");}
 updateHeader();renderBad();$("next").style.display="block";
}
function next(){n++;if(n%10===0){finish();return}question()}
function finish(){
 $("rCorrect").textContent=right;$("rWrong").textContent=wrong;$("rCombo").textContent=bestCombo;
 let p=Math.round(right/(right+wrong)*100);$("resultPercent").textContent=p+"%";$("resultText").textContent=`10문제 완료! ${p}% 정답률로 마쳤어요.`;
 show("result");
}
document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{document.querySelectorAll(".cat").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");cat=b.dataset.cat});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");mode=+b.dataset.mode});
$("start").onclick=()=>start(false);$("review").onclick=()=>start(true);$("next").onclick=next;$("again").onclick=()=>start(review);$("back").onclick=()=>{show("home");renderBad()};$("quit").onclick=()=>{show("home");renderBad()};
renderBad();updateHeader();
</script>
</body></html>
